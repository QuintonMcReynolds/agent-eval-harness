name: geoint
version: '1.0'
env: geoint
tasks:
- id: lk-passes
  category: lookup
  question: What collection passes are available for triage?
  expect:
    tools:
    - name: list_passes
      args: {}
    answer_contains:
    - passA
    - passB
    - passC
    - passD
  rubric: ''
- id: lk-collected-passA
  category: lookup
  question: When was passA collected?
  expect:
    tools:
    - name: list_passes
      args: {}
    answer_contains_any:
    - '2026-10-01'
    - October 1
    - Oct 1
    - 10/01
  rubric: ''
- id: lk-collected-passC
  category: lookup
  question: When was passC collected?
  expect:
    tools:
    - name: list_passes
      args: {}
    answer_contains_any:
    - '2026-10-03'
    - October 3
    - Oct 3
    - 10/03
  rubric: ''
- id: lk-analyst-passA
  category: lookup
  question: How many chips in passA need an analyst to review them?
  expect:
    tools:
    - name: triage_pass
      args:
        pass_id: passA
    answer_contains:
    - oracle: n_analyst
      args:
      - passA
  rubric: ''
- id: lk-novel-passA
  category: lookup
  question: In passA, how many chips look like nothing the model was trained on?
  expect:
    tools:
    - name: triage_pass
      args:
        pass_id: passA
    answer_contains:
    - oracle: n_novel
      args:
      - passA
  rubric: ''
- id: lk-topclass-passA
  category: lookup
  question: What land-cover class was auto-labeled most often in passA?
  expect:
    tools:
    - name: triage_pass
      args:
        pass_id: passA
    answer_contains:
    - oracle: top_class
      args:
      - passA
  rubric: ''
- id: lk-drift-passA
  category: lookup
  question: Is there any sign of drift in passA?
  expect:
    tools:
    - name: drift_check
      args:
        pass_id: passA
    polarity:
      oracle: drift_alarm
      args:
      - passA
    polarity_kind: drift
  rubric: ''
- id: lk-analyst-passB
  category: lookup
  question: How many chips in passB need an analyst to review them?
  expect:
    tools:
    - name: triage_pass
      args:
        pass_id: passB
    answer_contains:
    - oracle: n_analyst
      args:
      - passB
  rubric: ''
- id: lk-novel-passB
  category: lookup
