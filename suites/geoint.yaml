    tools:
    - name: triage_pass
      args:
        pass_id: passB
    answer_contains:
    - oracle: n_novel
      args:
      - passB
  rubric: ''
- id: lk-topclass-passB
  category: lookup
  question: What land-cover class was auto-labeled most often in passB?
  expect:
    tools:
    - name: triage_pass
      args:
        pass_id: passB
    answer_contains:
    - oracle: top_class
      args:
      - passB
  rubric: ''
- id: lk-drift-passB
  category: lookup
  question: Is there any sign of drift in passB?
  expect:
    tools:
    - name: drift_check
      args:
        pass_id: passB
    polarity:
      oracle: drift_alarm
      args:
      - passB
    polarity_kind: drift
  rubric: ''
- id: lk-analyst-passC
  category: lookup
  question: How many chips in passC need an analyst to review them?
  expect:
