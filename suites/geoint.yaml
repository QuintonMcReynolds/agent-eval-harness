    - name: classify_chip
      args:
        chip_id: passD-003
    answer_contains:
    - oracle: chip_label
      args:
      - passD-003
  rubric: ''
- id: lk-classify-passD-017
  category: lookup
  question: Classify chip passD-017.
  expect:
    tools:
    - name: classify_chip
      args:
        chip_id: passD-017
    answer_contains:
    - oracle: chip_label
      args:
      - passD-017
  rubric: ''
- id: ms-most-novel
  category: multi_step
  question: Which collection pass has the most chips flagged as novel?
  expect:
    tools: &id001
    - name: triage_pass
      args:
        pass_id: passA
    - name: triage_pass
      args:
        pass_id: passB
    - name: triage_pass
      args:
        pass_id: passC
    - name: triage_pass
      args:
        pass_id: passD
    answer_contains:
    - oracle: most_novel_pass
      args: []
  rubric: ''
- id: ms-most-analyst
  category: multi_step
  question: Which pass has the most chips waiting for an analyst?
  expect:
    tools: *id001
    answer_contains:
    - oracle: most_analyst_pass
      args: []
  rubric: ''
- id: ms-total-analyst
  category: multi_step
  question: How many chips across all passes need an analyst in total?
  expect:
    tools: *id001
    answer_contains:
    - oracle: total_analyst
      args: []
  rubric: ''
- id: ms-drifting
  category: multi_step
  question: Which passes show drift?
  expect:
    tools:
    - name: drift_check
      args:
        pass_id: passA
    - name: drift_check
      args:
        pass_id: passB
    - name: drift_check
      args:
        pass_id: passC
    - name: drift_check
      args:
        pass_id: passD
    answer_contains:
    - oracle: drifting_passes
      args: []
  rubric: Only the passes in the reference have drift; naming any other pass as drifting is wrong.
- id: ms-novel-similar-passC-014
  category: multi_step
  question: Is chip passC-014 novel, and which training class does it most resemble?
  expect:
    tools_any:
    - name: find_similar
      args:
        chip_id: passC-014
    - name: classify_chip
      args:
        chip_id: passC-014
    answer_contains:
    - oracle: neighbor_vote
      args:
      - passC-014
    polarity:
      oracle: chip_is_novel
      args:
      - passC-014
    polarity_kind: novel
  rubric: ''
- id: ms-novel-similar-passC-020
  category: multi_step
  question: Is chip passC-020 novel, and which training class does it most resemble?
  expect:
    tools_any:
    - name: find_similar
      args:
        chip_id: passC-020
    - name: classify_chip
      args:
        chip_id: passC-020
    answer_contains:
    - oracle: neighbor_vote
      args:
      - passC-020
    polarity:
      oracle: chip_is_novel
      args:
      - passC-020
    polarity_kind: novel
  rubric: ''
- id: ms-novel-similar-passC-021
  category: multi_step
  question: Is chip passC-021 novel, and which training class does it most resemble?
  expect:
    tools_any:
    - name: find_similar
      args:
        chip_id: passC-021
    - name: classify_chip
      args:
        chip_id: passC-021
    answer_contains:
    - oracle: neighbor_vote
      args:
      - passC-021
    polarity:
      oracle: chip_is_novel
      args:
      - passC-021
    polarity_kind: novel
  rubric: ''
- id: ms-list-novel-passC
  category: multi_step
  question: List the chip ids in passC that were flagged as novel.
  expect:
    tools:
    - name: triage_pass
      args:
        pass_id: passC
    answer_contains:
    - passC-014
    - passC-020
    - passC-021
    - passC-024
    - passC-026
    - passC-027
    - passC-033
    - passC-040
    - passC-055
  rubric: ''
- id: ms-compare-auto
  category: multi_step
  question: Which had more chips auto-labeled, passA or passB?
  expect:
    tools:
    - name: triage_pass
      args:
        pass_id: passA
    - name: triage_pass
      args:
        pass_id: passB
    answer_contains:
    - passA
  rubric: ''
- id: ms-drift-and-auto-passD
  category: multi_step
  question: Is passD drifting, and how many of its chips were auto-labeled?
  expect:
    tools:
    - name: drift_check
      args:
        pass_id: passD
    - name: triage_pass
      args:
        pass_id: passD
    answer_contains:
    - oracle: n_auto
      args:
      - passD
    polarity:
      oracle: drift_alarm
      args:
      - passD
    polarity_kind: drift
  rubric: ''
- id: ms-classcount-passB
  category: multi_step
  question: How many chips in passB were auto-labeled as AnnualCrop?
  expect:
    tools:
    - name: triage_pass
      args:
        pass_id: passB
    answer_contains:
    - oracle: auto_count
      args:
      - passB
      - AnnualCrop
  rubric: ''
- id: un-0
  category: unanswerable
  question: What are the GPS coordinates of chip passA-003?
  expect:
    refusal: true
    max_tool_calls: 4
  rubric: The tools cannot provide this. A correct answer says the information is unavailable (or the pass/chip does not exist)
    and does not invent a value.
- id: un-1
  category: unanswerable
  question: Which satellite sensor collected passB?
  expect:
    refusal: true
