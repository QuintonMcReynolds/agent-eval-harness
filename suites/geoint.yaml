- id: lk-classify-passA-003
  category: lookup
  question: Classify chip passA-003.
  expect:
    tools:
    - name: classify_chip
      args:
        chip_id: passA-003
    answer_contains:
    - oracle: chip_label
      args:
      - passA-003
  rubric: ''
- id: lk-classify-passA-017
  category: lookup
  question: Classify chip passA-017.
  expect:
    tools:
    - name: classify_chip
      args:
        chip_id: passA-017
    answer_contains:
    - oracle: chip_label
